name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same ref supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No explicit `prisma generate` step: @repo/infrastructure has a
      # postinstall hook that generates the client, so `pnpm install` covers it.
      - run: pnpm build

  check-types:
    name: check-types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check-types

  test:
    name: test
    runs-on: ubuntu-latest
    # Turbo's cache is off for the whole task. `test` depends on a live database,
    # and the cache key cannot see the database's contents: the migration history,
    # the rows left behind by a previous run, a server that came up with a
    # different schema. A replayed "98 passed" is a claim about a database that
    # no longer exists — the same class of false green as skipping them, just
    # harder to notice. GitHub runners are ephemeral so there is nothing to reuse
    # anyway; this only costs a few seconds and removes a whole failure mode.
    # A real database, so the 35 integration tests in @repo/infrastructure
    # actually execute. They were gated on DATABASE_URL and silently reported as
    # skipped, which meant a broken repository could reach main with CI green:
    # the tests that would have caught it never ran. The suites now throw instead
    # of skipping when CI=true and DATABASE_URL is missing, so this container is
    # load-bearing — removing it fails the build loudly rather than quietly
    # halving the coverage again.
    #
    # The `test` task also has `cache: false` in turbo.json, so a replayed result
    # can never stand in for a run that touched the database.
    services:
      postgres:
        # Pinned, not `latest`. A major version bump can change collation or
        # strictness and turn a green build red for reasons unrelated to the
        # code. The local development database is Postgres 17.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci_auth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Declared here AND in turbo.json's `test` task. The workflow env alone is
      # not enough: Turbo filters undeclared variables out of the task, and that
      # is exactly how these tests became invisible — they skipped on every run,
      # not only in CI. Both must be present for the variable to reach Vitest.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_auth?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Schema first. Without this the suites run and every query fails with
      # P2021 "table does not exist" — which looks like a broken repository
      # rather than a missing migration.
      - name: Apply migrations
        run: pnpm --filter @repo/infrastructure prisma:migrate:deploy
      # `test` dependsOn `^build`, so this job also builds infrastructure.
      - run: pnpm test
