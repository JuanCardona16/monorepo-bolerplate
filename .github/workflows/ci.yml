name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same ref supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    # Remote cache (TK-04). TURBO_TOKEN is a secret, TURBO_TEAM a variable;
    # the concatenation accepts whichever side the team value was saved on.
    # The `test` job is intentionally excluded: its task has `cache: false`
    # (live database), so remote cache could never serve it.
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  check-types:
    name: check-types
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check-types

  test:
    name: test
    runs-on: ubuntu-latest
    # Turbo's cache is off for the whole task. `test` depends on a live database,
    # and the cache key cannot see the database's contents: the migration history,
    # the rows left behind by a previous run, a server that came up with a
    # different schema. A replayed "98 passed" is a claim about a database that
    # no longer exists — the same class of false green as skipping them, just
    # harder to notice. GitHub runners are ephemeral so there is nothing to reuse
    # anyway; this only costs a few seconds and removes a whole failure mode.
    # A real database, so the MongoDB integration tests in
    # @repo/infrastructure actually execute. They are gated on MONGODB_URI and
    # silently report as skipped without it, which meant a broken repository
    # could reach main with CI green: the tests that would have caught it never
    # ran. The suites now throw instead of skipping when CI=true and
    # MONGODB_URI is missing, so this container is load-bearing — removing it
    # fails the build loudly rather than quietly halving the coverage again.
    #
    # The `test` task also has `cache: false` in turbo.json, so a replayed result
    # can never stand in for a run that touched the database.
    services:
      mongo:
        # Pinned, not `latest`. A major version bump can change strictness and
        # turn a green build red for reasons unrelated to the code.
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Declared here AND in turbo.json's `test` task. The workflow env alone is
      # not enough: Turbo filters undeclared variables out of the task, and that
      # is exactly how these tests became invisible — they skipped on every run,
      # not only in CI. Both must be present for the variable to reach Vitest.
      MONGODB_URI: mongodb://localhost:27017/ci_auth
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `test` dependsOn `^build`, so this job also builds infrastructure.
      - run: pnpm test
